name: Launcher Expressive Settings Static Check

on:
  push:
    branches:
      - "feat/uwu17-expressive-settings-foundation"
    paths:
      - "src/com/android/launcher3/settings/SettingsActivity.kt"
      - "src/com/android/launcher3/settings/LauncherExpressiveSettingsTheme.kt"
      - "tools/qa/test_launcher_expressive_settings_theme.py"
      - ".github/workflows/launcher-expressive-settings-check.yml"
  pull_request:
    paths:
      - "src/com/android/launcher3/settings/SettingsActivity.kt"
      - "src/com/android/launcher3/settings/LauncherExpressiveSettingsTheme.kt"
      - "tools/qa/test_launcher_expressive_settings_theme.py"
      - ".github/workflows/launcher-expressive-settings-check.yml"

permissions:
  contents: read

jobs:
  source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify SettingsLib palette and M3 Expressive motion handoff
        run: python3 -m unittest discover -s tools/qa -p "test_launcher_expressive_settings_theme.py" -v
